<h2 mat-dialog-title>{{ isNew ? 'Add' : 'Edit' }} item</h2>

<form #itemForm="ngForm">
    <mat-dialog-content>
        <div>
            <mat-form-field class="example-full-width">
                <mat-label>Name</mat-label>
                <input
                    #name="ngModel"
                    name="name"
                    matInput
                    pattern=".*\S.*"
                    required
                    [(ngModel)]="formModel.name"
                >
                @if (name.invalid && (name.touched || itemForm.submitted)) {
                    <mat-error>Name is required</mat-error>
                }
            </mat-form-field>
        </div>
        <div>
            <mat-form-field class="example-full-width">
                <mat-label>Quantity</mat-label>
                <input
                    #quantity="ngModel"
                    type="number"
                    min="1"
                    matInput
                    required
                    name="quantity"
                    [(ngModel)]="formModel.quantity"
                >
                @if (quantity.invalid && (quantity.touched || itemForm.submitted)) {
                    <mat-error>Quantity must be at least 1</mat-error>
                }
            </mat-form-field>
        </div>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
        <button matButton mat-dialog-close type="button">Cancel</button>
        <button
            matButton="filled"
            color="primary"
            type="submit"
            [disabled]="itemForm.invalid"
            [mat-dialog-close]="result"
        >
            Save
        </button>
    </mat-dialog-actions>
</form>
