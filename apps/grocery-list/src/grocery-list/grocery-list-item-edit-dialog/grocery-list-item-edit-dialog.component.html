<h2 mat-dialog-title>{{ isNew ? 'Add' : 'Edit' }} item</h2>

<form [formGroup]="form">
  <mat-dialog-content>
    <div>
      <mat-form-field class="example-full-width">
        <mat-label>Name</mat-label>
        <input formControlName="name" matInput required />
        @if (form.controls.name.invalid && (form.controls.name.touched || form.touched)) {
          <mat-error>Name is required</mat-error>
        }
      </mat-form-field>
    </div>
    <div>
      <mat-form-field class="example-full-width">
        <mat-label>Quantity</mat-label>
        <input formControlName="quantity" type="number" min="1" step="1" matInput required />
        @if (form.controls.quantity.invalid && (form.controls.quantity.touched || form.touched)) {
          <mat-error>Quantity must be at least 1</mat-error>
        }
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button matButton mat-dialog-close type="button">Cancel</button>
    <button
      matButton="filled"
      color="primary"
      type="submit"
      [disabled]="form.invalid"
      [mat-dialog-close]="result"
    >
      Save
    </button>
  </mat-dialog-actions>
</form>
